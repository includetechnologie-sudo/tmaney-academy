<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Paiement confirmé — T.Maney Academy</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        --background: oklch(0.9 0.009 85);
        --foreground: oklch(0.2 0.01 60);
        --card: oklch(0.97 0.005 90);
        --muted-foreground: oklch(0.45 0.015 70);
        --gold: oklch(0.78 0.107 85);
        --gold-deep: oklch(0.62 0.096 80);
        --border: oklch(0.78 0.107 85 / 30%);
        --primary-foreground: oklch(0.12 0.006 60);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family: "Jost", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 32rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 2.5rem 2rem;
        text-align: center;
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 1.25rem;
        color: var(--gold-deep);
      }
      h1 {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 2.25rem;
        font-weight: 500;
        margin: 0 0 0.75rem;
      }
      p {
        font-size: 0.9rem;
        line-height: 1.6;
        color: var(--muted-foreground);
        margin: 0 0 1.75rem;
      }
      .rule {
        width: 10rem;
        height: 1px;
        margin: 0 auto 1.5rem;
        background: linear-gradient(to right, transparent, var(--gold), transparent);
      }
      .actions { display: flex; flex-direction: column; gap: 0.75rem; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        padding: 1rem 1.5rem;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        text-decoration: none;
        border-radius: 0.25rem;
      }
      .btn-primary { background: var(--gold); color: var(--primary-foreground); }
      .btn-secondary { background: transparent; color: var(--foreground); border: 1px solid var(--border); }
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10" />
        <path d="M8.5 12.5l2.5 2.5 5-5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <h1>Paiement confirmé</h1>
      <div class="rule"></div>
      <p id="message">
        Merci pour votre confiance. Votre paiement a bien été reçu par T.Maney Academy.
      </p>
      <div class="actions">
        <a id="telegram-link" class="btn btn-primary" href="#" target="_blank" rel="noopener noreferrer" style="display: none">
          Rejoindre le groupe Télégram
        </a>
        <a id="whatsapp-link" class="btn" href="#" target="_blank" rel="noopener noreferrer">
          Besoin d'aide ? Nous écrire sur WhatsApp
        </a>
        <a class="btn btn-secondary" href="/formations-en-ligne">Retour aux formations</a>
      </div>
    </main>

    <script>
      var FORMATIONS = {
        "bridal-1": { name: "Module 1 : Bridal 1", telegram: "https://t.me/+ZDgJ12VBedgzYjE0" },
        "bridal-2": { name: "Module 2 : Bridal 2", telegram: "https://t.me/+YLhVOOkJVmBlM2Q0" },
        "bridal-3": { name: "Module 3 : Bridal 3", telegram: "https://t.me/+JSEzXSQctL4wZjQ8" },
        "pack-bridal": { name: "PACK Complet Bridal + Bonus", telegram: "https://t.me/+pDDA69YoffZiZTFk" },
        "test-group": { name: "Groupe Test", telegram: "https://t.me/+dNtMoks1-_ZhNTNk" },
      };
      var WHATSAPP_NUMBER = "237697216348";
      var MYCOOLPAY_PUBLIC_KEY = "40b4a1ed-11a0-4735-9013-5b281f5e2ee8";
      var PENDING_KEY = "tmaney_pending_payment";

      var messageEl = document.getElementById("message");
      var telegramLink = document.getElementById("telegram-link");
      var whatsappLink = document.getElementById("whatsapp-link");

      function showTelegramSuccess(formation, nom) {
        messageEl.textContent =
          (nom ? "Merci " + nom + ", " : "Merci, ") +
          "votre paiement pour « " + formation.name + " » a bien été reçu. " +
          "Cliquez ci-dessous pour rejoindre directement le groupe Télégram de la formation.";
        telegramLink.href = formation.telegram;
        telegramLink.style.display = "";
        whatsappLink.classList.add("btn-secondary");
        setWhatsappText(formation.name, nom, "Je n'arrive pas à accéder au groupe Télégram, merci de m'aider.");
      }

      function showGenericFallback() {
        whatsappLink.classList.add("btn-primary");
        whatsappLink.textContent = "Récupérer mon accès sur WhatsApp";
        setWhatsappText("", "", "Merci de me donner accès au groupe Télégram.");
      }

      function setWhatsappText(formationName, nom, closing) {
        var text = [
          "Bonjour T.Maney Academy, je viens de payer",
          formationName ? "la formation : " + formationName : "ma formation",
          nom ? "Nom : " + nom : "",
          closing,
        ]
          .filter(Boolean)
          .join("\n");
        whatsappLink.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(text);
      }

      function getPendingPayment() {
        try {
          var raw = localStorage.getItem(PENDING_KEY);
          if (!raw) return null;
          var data = JSON.parse(raw);
          // Ignore les entrées de plus de 48h (opérateur mobile money trop lent, etc.)
          if (!data.transactionRef || Date.now() - data.ts > 48 * 60 * 60 * 1000) return null;
          return data;
        } catch {
          return null;
        }
      }

      function clearPendingPayment() {
        try {
          localStorage.removeItem(PENDING_KEY);
        } catch {
          // ignore
        }
      }

      // 1) Chemin rapide : les paramètres passés à MyCoolPay sont revenus intacts dans l'URL.
      var params = new URLSearchParams(window.location.search);
      var urlFormationId = params.get("formation") || "";
      var urlFormation = FORMATIONS[urlFormationId];

      if (urlFormation) {
        showTelegramSuccess(urlFormation, params.get("nom") || "");
        clearPendingPayment();
      } else {
        // 2) Filet de secours : la redirection a perdu ses paramètres (connexion
        // coupée, onglet fermé puis rouvert...). On revérifie directement auprès
        // de MyCoolPay via la référence de transaction sauvegardée localement.
        var pending = getPendingPayment();
        var pendingFormation = pending ? FORMATIONS[pending.formation] : null;

        if (pending && pendingFormation) {
          messageEl.textContent = "Vérification de votre paiement en cours…";
          whatsappLink.style.display = "none";

          fetch("https://my-coolpay.com/api/" + MYCOOLPAY_PUBLIC_KEY + "/checkStatus/" + pending.transactionRef)
            .then(function (res) {
              return res.json();
            })
            .then(function (payload) {
              whatsappLink.style.display = "";
              var txStatus = payload && payload.transaction_status;

              if (payload && payload.status === "success" && txStatus === "SUCCESS") {
                showTelegramSuccess(pendingFormation, pending.nom);
                clearPendingPayment();
              } else if (txStatus === "PENDING" || txStatus === "CREATED") {
                messageEl.textContent =
                  "Votre paiement pour « " +
                  pendingFormation.name +
                  " » est encore en cours de traitement auprès de l'opérateur. " +
                  "Patientez quelques instants puis rafraîchissez cette page.";
                showGenericFallback();
              } else {
                messageEl.textContent =
                  "Nous n'avons pas trouvé de paiement confirmé pour votre dernière tentative (« " +
                  pendingFormation.name +
                  " »). Si vous avez bien payé, contactez-nous sur WhatsApp avec votre référence.";
                setWhatsappText(pendingFormation.name, pending.nom, "Référence : " + pending.transactionRef + ". Mon paiement n'a pas été confirmé sur le site, pouvez-vous vérifier ?");
                showGenericFallback();
                clearPendingPayment();
              }
            })
            .catch(function () {
              whatsappLink.style.display = "";
              messageEl.textContent =
                "Impossible de vérifier votre paiement pour le moment (connexion instable). " +
                "Rafraîchissez cette page dans un instant, ou contactez-nous sur WhatsApp.";
              showGenericFallback();
            });
        } else {
          messageEl.textContent = "Merci pour votre confiance. Votre paiement a bien été reçu par T.Maney Academy.";
          showGenericFallback();
        }
      }
    </script>
  </body>
</html>
